<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 장식 원 -->
  <circle cx="1120" cy="-80" r="320" fill="rgba(255,255,255,0.08)"/>
  <circle cx="420" cy="690" r="200" fill="rgba(255,255,255,0.06)"/>

  <!-- 로고 -->
  <circle cx="72" cy="56" r="7" fill="white"/>
  <text x="92" y="68" font-family="'Noto Sans KR', sans-serif" font-size="26" font-weight="900" fill="rgba(255,255,255,0.95)" letter-spacing="-0.5">컬러랩</text>
  <text x="178" y="66" font-family="sans-serif" font-size="12" fill="rgba(255,255,255,0.5)" letter-spacing="2">COLORLAB.KR</text>

  <!-- AI 서비스 태그 -->
  <text x="72" y="220" font-family="'Noto Sans KR', sans-serif" font-size="18" fill="rgba(255,255,255,0.7)" letter-spacing="1">AI 퍼스널컬러 진단 서비스</text>

  <!-- 메인 카피 -->
  <text x="72" y="305" font-family="'Noto Sans KR', sans-serif" font-size="68" font-weight="900" fill="white" letter-spacing="-2">나에게 진짜</text>
  <text x="72" y="385" font-family="'Noto Sans KR', sans-serif" font-size="68" font-weight="900" fill="white" letter-spacing="-2">어울리는 색, 컬러랩</text>

  <!-- 서브 카피 -->
  <text x="72" y="435" font-family="'Noto Sans KR', sans-serif" font-size="24" fill="rgba(255,255,255,0.75)">AI가 분석하는 퍼스널컬러 진단</text>

  <!-- 컬러 칩 1행 -->
  <circle cx="72"  cy="535" r="26" fill="#FFB6C1" stroke="rgba(255,255,255,0.35)" stroke-width="3"/>
  <circle cx="148" cy="535" r="26" fill="#FFD580" stroke="rgba(255,255,255,0.35)" stroke-width="3"/>
  <circle cx="224" cy="535" r="26" fill="#E6C8D8" stroke="rgba(255,255,255,0.35)" stroke-width="3"/>
  <circle cx="300" cy="535" r="26" fill="#C4A0A0" stroke="rgba(255,255,255,0.35)" stroke-width="3"/>

  <!-- 컬러 칩 2행 (살짝 겹침) -->
  <circle cx="110" cy="575" r="22" fill="#C8A882" stroke="rgba(255,255,255,0.35)" stroke-width="3"/>
  <circle cx="186" cy="575" r="22" fill="#7B3F00" stroke="rgba(255,255,255,0.35)" stroke-width="3"/>
  <circle cx="262" cy="575" r="22" fill="#CC0000" stroke="rgba(255,255,255,0.35)" stroke-width="3"/>
  <circle cx="338" cy="575" r="22" fill="#1C1C2E" stroke="rgba(255,255,255,0.35)" stroke-width="3"/>

  <!-- 하단 URL -->
  <text x="1128" y="610" font-family="sans-serif" font-size="14" fill="rgba(255,255,255,0.5)" text-anchor="end">colorlab.kr</text>
</svg>
